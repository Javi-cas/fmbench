name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    name: integrity (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # The integrity suite uses the standard library only, so the heavy
        # scientific dependencies in requirements.txt are not installed here.
        run: python -m pip install --upgrade pip pytest
      - name: Run integrity tests
        run: pytest -v
