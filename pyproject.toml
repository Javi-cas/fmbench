[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmbench"
version = "0.1.0"
description = "Evaluation of single-cell foundation model embeddings as the similarity that weights transfer of CRISPRi knockdown effects to an unseen cell line"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Javier Villela-Castrejon", email = "javi.cas@tamu.edu" }]
keywords = ["benchmark", "single-cell", "foundation-models", "scgpt", "geneformer", "perturbation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["dependencies"]

[project.urls]
Source = "https://github.com/Javi-cas/fmbench"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Scripts live at the repository root rather than in an importable package,
# so auto-discovery is turned off deliberately.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
